<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SIGE UFPI</title>
    <link rel="stylesheet" href="../css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">
          <div class="logo-icon">UF</div>
          <h1>SIGE UFPI</h1>
          <p>Sistema de Gerenciamento de Equipamentos de Informática</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="seu@ufpi.edu.br"
              required
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-btn">
            Entrar
          </button>
        </form>

        <p
          style="
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
          "
        >
          Universidade Federal do Piauí
        </p>
      </div>
    </div>

    <script src="../services/api.js"></script>
    <script src="../services/auth.js"></script>
    <script src="../components/toast.js"></script>
    <script src="../components/loading.js"></script>
    <script src="../scripts/utils.js"></script>

    <script>
      if (AuthService.isAuthenticated()) {
        window.location.href = "./dashboard.html";
      }

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("login-btn");
        btn.disabled = true;
        Loading.show();

        try {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const res = await ApiService.post("/auth/login", { email, password });

          if (res?.success) {
            const token = res.data.token;
            const user = res.data.user;
            AuthService.saveSession(token, user);
            Toast.success("Login realizado com sucesso!");
            setTimeout(() => {
              window.location.href = "./dashboard.html";
            }, 550);
          } else {
            Toast.error(res?.message || "Falha no login");
          }
        } catch (err) {
          Toast.error(Utils.getApiErrorMessage(err));
        } finally {
          Loading.hide();
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
